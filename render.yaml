services:
  - type: web
    name: selfhire-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/verify_and_sync_schema.py
    startCommand: uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOW_CLOUD_MODELS
        value: "false"
      - key: APPROVAL_TTL_MINUTES
        value: "30"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false
