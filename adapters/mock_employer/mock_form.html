<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Employer Career Portal — Junior Full Stack Developer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F7F8FC;
            color: #151B32;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #E2E8F0;
        }
        h1 { margin-top: 0; color: #151B32; font-size: 24px; }
        .meta { color: #64748B; font-size: 14px; margin-bottom: 24px; }
        .field { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group { display: flex; gap: 16px; margin-top: 6px; }
        .btn-submit {
            background-color: #B34A0E;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
        .btn-submit:hover { background-color: #8C3707; }
        .success-box {
            display: none;
            background: #ECFDF5;
            border: 1px solid #10B981;
            padding: 24px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container" id="application-container">
        <h1>TechCorp India — Junior Full Stack Developer</h1>
        <div class="meta">Location: Bengaluru, India (Hybrid) | Job ID: #TC-98421</div>

        <form id="job-form" onsubmit="handleSubmit(event)">
            <div class="field">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name" required placeholder="e.g. Alex Rivera">
            </div>

            <div class="field">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required placeholder="alex.rivera@example.com">
            </div>

            <div class="field">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required placeholder="+91 98765 43210">
            </div>

            <div class="field">
                <label for="location">Current Location *</label>
                <input type="text" id="location" name="location" required placeholder="Pune, India">
            </div>

            <div class="field">
                <label for="skills">Primary Technical Skills *</label>
                <input type="text" id="skills" name="skills" required placeholder="Python, JavaScript, React, SQL">
            </div>

            <div class="field">
                <label for="work_authorization">Are you legally authorized to work in India? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="work_auth" value="Yes" required> Yes</label>
                    <label><input type="radio" name="work_auth" value="No"> No</label>
                </div>
            </div>

            <div class="field">
                <label for="experience_years">Years of Full-Stack Experience</label>
                <select id="experience_years" name="experience_years">
                    <option value="">Select experience...</option>
                    <option value="0-1">0-1 Years (Entry Level / Fresher)</option>
                    <option value="1-3">1-3 Years (Junior)</option>
                    <option value="3-5">3-5 Years (Mid-Level)</option>
                </select>
            </div>

            <div class="field">
                <label for="resume">Resume / CV (PDF or DOCX) *</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.docx">
            </div>

            <div class="field">
                <label for="cover_letter">Brief Note / Motivation</label>
                <textarea id="cover_letter" name="cover_letter" rows="3" placeholder="Why are you interested in TechCorp?"></textarea>
            </div>

            <div class="field">
                <label>
                    <input type="checkbox" id="terms" required>
                    I certify that all information submitted is truthful and accurate.
                </label>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">Submit Application</button>
        </form>
    </div>

    <div class="container success-box" id="success-box">
        <h2 style="color: #065F46;">Application Submitted Successfully!</h2>
        <p>Thank you for applying to TechCorp India.</p>
        <p><strong>Confirmation Number:</strong> <span id="receipt-id">CONF-TC-2026-98421</span></p>
        <p style="color: #64748B; font-size: 13px;">Timestamp: <span id="timestamp"></span></p>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            document.getElementById('application-container').style.display = 'none';
            document.getElementById('success-box').style.display = 'block';
            document.getElementById('timestamp').innerText = new Date().toISOString();
        }
    </script>
</body>
</html>
