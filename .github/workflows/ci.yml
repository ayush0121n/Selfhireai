name: Continuous Integration & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-verification:
    name: Python Backend Test Suite (70 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio

      - name: Initialize SQLite Schema
        run: |
          mkdir -p data/uploads data/receipts
          python scripts/seed_database.py
          python scripts/seed_job_sources.py
          python scripts/seed_rich_multi_portal_jobs.py
          python scripts/verify_and_sync_schema.py

      - name: Run Automated Pytest Suite
        run: |
          python -m pytest tests/unit/ -v

  frontend-verification:
    name: Next.js & TypeScript Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Node Dependencies
        working-directory: apps/web
        run: |
          npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        working-directory: apps/web
        run: |
          npx tsc --noEmit
